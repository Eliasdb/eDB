# pnpm-workspace.yaml
packages:
  - apps/** # all app folders
  - libs/** # all libraries
  - tools/workbench-plugin

allowBuilds:
  '@carbon/colors': true
  '@carbon/feature-flags': true
  '@carbon/grid': true
  '@carbon/icons': true
  '@carbon/layout': true
  '@carbon/motion': true
  '@carbon/styles': true
  '@carbon/themes': true
  '@carbon/type': true
  '@ibm/plex': true
  '@ibm/plex-mono': true
  '@ibm/plex-sans': true
  '@ibm/plex-sans-arabic': true
  '@ibm/plex-sans-devanagari': true
  '@ibm/plex-sans-thai-looped': true
  '@ibm/plex-serif': true
  '@nestjs/core': true
  '@openapitools/openapi-generator-cli': true
  '@parcel/watcher': true
  '@swc/core': true
  '@tailwindcss/oxide': true
  carbon-components-angular: true
  core-js-pure: true
  cypress: true
  esbuild: true
  lmdb: true
  msgpackr-extract: true
  nx: true
  unrs-resolver: true

overrides:
  ora: 5.4.1
  find-cache-directory: npm:find-cache-dir@3.3.2
  fastify: ^5.6.1
  fastify-plugin: ^5.0.0
  glob: 10.5.0
  tar: 7.5.2
  body-parser: 2.2.1
  js-yaml: 4.1.1
  typescript: 5.9.3
  ts-node: 10.9.2
  node-forge: 1.3.2
  react-server-dom-webpack: 19.0.3
  esbuild: 0.25.0
  vite: 7.3.2
